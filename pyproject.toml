# 说明：
# 1. 主依赖来源统一收敛到 pyproject.toml。
# 2. 运行环境通过 uv.lock 固定，避免不同机器解析出不同版本组合。
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moneyprinterturbo"
version = "1.3.2"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README-en.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.60.0",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.8",
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "openai==2.47.0",
    "faster-whisper==1.2.1",
    "loguru==0.7.3",
    "dashscope==1.26.4",
    "azure-cognitiveservices-speech==1.51.0",
    "redis==8.0.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "packaging==26.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.93.0",
    "google-genai==2.13.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.3.0",
]
# Painel Django multi-nicho (Create / Clip / Dub / YouTube).
panel = [
    "django>=5.2,<6",
    "django-environ>=0.12.0",
    "google-api-python-client>=2.160.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI 需要先把项目根目录加入 sys.path，随后才能导入 app 包。
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# 统计分支覆盖率可以识别“代码行执行了，但条件的另一条分支从未验证”的情况，
# 比只统计行覆盖率更适合作为 CI 质量基线。CLI 和 WebUI 都属于生产入口，
# 因此与 app 服务层、服务启动入口和面向 Agent 用户发布的 Skill 脚本一起
# 纳入统计，避免覆盖率只反映局部模块。
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Python 3.14 is the recommended runtime (latest stable bugfix line as of 2026).
# Coverage floor stays at 70% across supported CPython versions.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# 当前项目以应用运行形态为主，不作为可发布的 Python 包安装。
package = false
