<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar — MoneyPrinter</title>
  <meta name="description" content="Login do painel MoneyPrinter.">
  <meta name="theme-color" content="#0e1117">
  <link rel="stylesheet" href="/static/ui/css/app.css">
</head>
<body>
  <main class="auth-shell">
    <header class="page-head">
      <h1>Money<span style="color:var(--accent)">Printer</span></h1>
      <p>Entre na sua conta do painel.</p>
    </header>
    {% if form.errors %}
    <ul class="messages"><li class="error">Usuário ou senha inválidos.</li></ul>
    {% endif %}
    <article class="card">
      <form method="post" class="form-stack">
        {% csrf_token %}
        <div>
          <label for="id_username">Usuário</label>
          <input type="text" name="username" id="id_username" autofocus required autocomplete="username">
        </div>
        <div>
          <label for="id_password">Senha</label>
          <input type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="muted" style="margin-top:1rem;">
        Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a>
      </p>
    </article>
  </main>
</body>
</html>
