{% if error %}
<p style="color:var(--danger);margin:0.5rem 0 0;">{{ error }}</p>
{% elif topics %}
<p class="muted" style="margin:0.5rem 0 0.35rem;">Clique para preencher o tema:</p>
<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0.4rem;">
  {% for t in topics %}
  <li>
    <button
      type="button"
      class="btn secondary"
      style="width:100%;text-align:left;white-space:normal;height:auto;padding:0.55rem 0.75rem;"
      data-topic="{{ t|escape }}"
      onclick="(function(b){var el=document.getElementById('id_topic'); if(el){el.value=b.getAttribute('data-topic')||''; el.focus();}})(this)"
    >{{ t }}</button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted" style="margin:0.5rem 0 0;">Nenhuma sugestão retornada.</p>
{% endif %}
